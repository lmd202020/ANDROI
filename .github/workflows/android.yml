name: Build MINHDUC Android APK PRO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Locate and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts

          APK="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

          cp "$APK" release-artifacts/MINHDUC-ANDROID-ELITE-DEBUG.apk
          ls -lh release-artifacts/MINHDUC-ANDROID-ELITE-DEBUG.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MINHDUC-ANDROID-ELITE-DEBUG
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14
